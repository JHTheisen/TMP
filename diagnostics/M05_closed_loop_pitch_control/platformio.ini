[platformio]
default_envs = esp32dev
include_dir = ../../firmware/include

[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    gin66/FastAccelStepper@1.2.7
    robtillaart/AS5600@0.6.7
    adafruit/Adafruit BNO08x@1.2.7
    ; Match the transitive library versions installed in the verified M04 build.
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit Unified Sensor@1.1.15
